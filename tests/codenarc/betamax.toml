#   GrailsDomainGormMethods, NonSerializableFieldInSerializableClass

# Formatting rules groovyfmt's formatter covers (19):
#   ConsecutiveBlankLines: runs of blank lines always collapse to one
#   FileEndsWithoutNewline: files always end with one newline
#   Indentation: every line is re-indented (indent, continuation_indent, use_tabs)
#   TrailingWhitespace: trailing whitespace is always removed
#   SpaceAfterCatch: normalize_spacing = true
#   SpaceAfterClosingBrace: normalize_spacing = true
#   SpaceAfterComma: normalize_spacing = true
#   SpaceAfterFor: normalize_spacing = true
#   SpaceAfterIf: normalize_spacing = true
#   SpaceAfterMethodCallName: normalize_spacing = true
#   SpaceAfterMethodDeclarationName: normalize_spacing = true
#   SpaceAfterOpeningBrace: normalize_spacing = true
#   SpaceAfterSwitch: normalize_spacing = true
#   SpaceAfterWhile: normalize_spacing = true
#   SpaceAroundClosureArrow: normalize_spacing = true
#   SpaceAroundOperator: normalize_spacing = true
#   SpaceBeforeClosingBrace: normalize_spacing = true
#   SpaceBeforeOpeningBrace: normalize_spacing = true
#   SpaceInsideParentheses: normalize_spacing = true
