name: Set up groovyfmt
description: Install a groovyfmt release binary on PATH and optionally run it
author: costajohnt
branding:
  icon: check-square
  color: green

inputs:
  version:
    description: >-
      Release to install, such as 0.8.0 or v0.8.0, or "latest". Default: the
      release matching the version of the action ref you use (its Cargo.toml),
      which fails if that version has no release.
    required: false
    default: ""
  args:
    description: >-
      Arguments to run groovyfmt with after installing, split on whitespace.
      Empty to only install it.
    required: false
    default: --check --output-format github
  token:
    description: Token used to download the release assets.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The installed release tag, such as v0.8.0
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        repo=costajohnt/groovyfmt
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) target=x86_64-unknown-linux-musl ;;
          Linux/ARM64) target=aarch64-unknown-linux-musl ;;
          macOS/X64) target=x86_64-apple-darwin ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
          Windows/X64) target=x86_64-pc-windows-gnu ;;
          *)
            echo "::error::groovyfmt has no release binary for $RUNNER_OS/$RUNNER_ARCH yet (Linux and macOS, x64 and arm64, and Windows x64 only)"
            exit 1 ;;
        esac
        version=$INPUT_VERSION
        from="the version input"
        if [ -z "$version" ]; then
          # A release tag's Cargo.toml version equals the tag (check-release-tag.sh), so this is the
          # action ref's release. A tag whose release run failed, or a branch ahead of the last
          # release, has none: that fails below rather than install a release the ref didn't name.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$GITHUB_ACTION_PATH/Cargo.toml" | head -n 1)
          from="the Cargo.toml of the action ref"
        fi
        if [ "$version" = latest ]; then
          tag=$(gh release view --repo "$repo" --json tagName --jq .tagName)
        elif [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          tag=v${version#v}
        else
          echo "::error::version must be like 0.8.0, v0.8.0 or latest"
          exit 1
        fi
        if ! gh release view "$tag" --repo "$repo" --json tagName > /dev/null; then
          echo "::error::No groovyfmt release $tag (the version from $from) at https://github.com/$repo/releases. Use the action at a release tag, or set version to latest or to a version that has a release."
          exit 1
        fi
        # Windows gets a .zip; every step here runs in bash, which is Git Bash on Windows runners
        ext=tar.gz
        if [ "$RUNNER_OS" = Windows ]; then ext=zip; fi
        archive=groovyfmt-$tag-$target.$ext
        dir=$RUNNER_TEMP/groovyfmt-$tag-$target
        rm -rf "$dir"
        mkdir -p "$dir"
        gh release download "$tag" --repo "$repo" --dir "$dir" --pattern "$archive" --pattern "$archive.sha256"
        expected=$(cut -d ' ' -f 1 "$dir/$archive.sha256")
        if command -v shasum > /dev/null; then sum="shasum -a 256"; else sum=sha256sum; fi
        actual=$($sum "$dir/$archive" | cut -d ' ' -f 1)
        if [ "$expected" != "$actual" ] || [ -z "$actual" ]; then
          echo "::error::Checksum mismatch for $archive: expected $expected, got $actual"
          exit 1
        fi
        if [ "$ext" = zip ]; then
          # Expand-Archive is in every PowerShell; the paths go in through the environment, unquoted
          ZIP="$dir/$archive" DEST="$dir" pwsh -NoProfile -NonInteractive -Command 'Expand-Archive -LiteralPath $env:ZIP -DestinationPath $env:DEST -Force'
          mv "$dir/groovyfmt-$tag-$target/groovyfmt.exe" "$dir/groovyfmt.exe"
          # GITHUB_PATH takes a Windows path there
          path_dir=$(cygpath -w "$dir")
        else
          tar -xzf "$dir/$archive" -C "$dir" --strip-components=1
          path_dir=$dir
        fi
        "$dir/groovyfmt" --version
        echo "$path_dir" >> "$GITHUB_PATH"
        echo "version=$tag" >> "$GITHUB_OUTPUT"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
    - if: inputs.args != ''
      shell: bash
      env:
        INPUT_ARGS: ${{ inputs.args }}
        GROOVYFMT_DIR: ${{ steps.install.outputs.dir }}
      run: |
        set -euo pipefail
        read -r -a args <<< "$INPUT_ARGS"
        "$GROOVYFMT_DIR/groovyfmt" ${args[@]+"${args[@]}"}
