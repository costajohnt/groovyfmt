name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: check tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: .github/scripts/check-release-tag.sh

  # fmt, clippy, tests, the minimum Rust version, and the four release builds
  # with their smoke tests. The build job uploads the archives published below.
  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  release:
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" groovyfmt-*.tar.gz* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
