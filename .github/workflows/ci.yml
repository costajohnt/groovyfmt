name: CI

# Runs on every pull request and every push to main, so a break on macOS or in
# an install channel shows up before a release tag is pushed rather than at it.
# scripts/ci-local.sh runs the Linux half of this on your own machine.
#
# Hosted macOS runners are scarce: with five macOS jobs per run, one was often
# cancelled unassigned ("The job was not acquired by Runner of type hosted")
# and marked a good commit red. So pull requests and pushes run one macOS job,
# test (macos-latest). The macOS release builds run for a tag and for a manual
# run; the macOS action and npm jobs run for a manual run. Before tagging:
# gh workflow run ci.yml --ref main
on:
  pull_request:
  push:
    branches: [main]
  # release.yml calls this workflow, so a tag publishes only if every job here passes.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Format and lint our own fixtures
        run: |
          cargo build --release --locked
          printf 'class A {\ndef f() {\nprintln 1\n}\n}\n' > /tmp/A.groovy
          ./target/release/groovyfmt --check /tmp/A.groovy && exit 1 || true
          ./target/release/groovyfmt /tmp/A.groovy
          ./target/release/groovyfmt --check /tmp/A.groovy

  msrv:
    # Keep in step with rust-version in Cargo.toml.
    name: test (Rust 1.90.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo +1.90.0 test --locked

  # The release targets, built and run on every run of this workflow. On a tag,
  # release.yml publishes the archives this job uploads.
  build:
    name: build (${{ matrix.target }})
    # Windows is cross-compiled with mingw-w64 and smoke-tested under Wine: no Windows runner.
    runs-on: ${{ contains(matrix.target, 'apple') && 'macos-latest' || matrix.target == 'aarch64-unknown-linux-musl' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-gnu
        # The macOS targets build only for a tag or a manual run (see the top of this file).
        exclude:
          - target: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'none' || 'aarch64-apple-darwin' }}
          - target: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'none' || 'x86_64-apple-darwin' }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      # .cargo/config.toml sets the linker and links the C runtime statically
      - name: mingw-w64 and Wine
        if: contains(matrix.target, 'windows')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 wine64
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
        run: cargo build --release --locked --target "$TARGET"
      - name: Smoke test
        shell: bash
        run: |
          set -exo pipefail
          bin=target/$TARGET/release/groovyfmt
          case $TARGET in *windows*) bin=$bin.exe ;; esac
          file "$bin"
          run=
          case $TARGET in
            *linux*)
              # Rust's musl targets link static-pie, which file(1) reports as "static-pie linked".
              file "$bin" | grep -Eq 'statically linked|static-pie linked'
              readelf -d "$bin" > dyn.txt || true
              cat dyn.txt
              if grep -q NEEDED dyn.txt; then exit 1; fi
              # No glibc: the binary must start on Alpine.
              docker run --rm -v "$PWD/$bin:/groovyfmt:ro" alpine:3 /groovyfmt --version ;;
            x86_64-apple-darwin) run='arch -x86_64' ;;
            *windows*)
              # Only Windows' own DLLs: no mingw runtime to ship alongside.
              x86_64-w64-mingw32-objdump -p "$bin" | grep 'DLL Name' | tee dlls.txt
              if grep -viE 'DLL Name: (kernel32|ntdll|msvcrt|ws2_32|userenv|advapi32|bcrypt|bcryptprimitives|api-ms-win-[a-z0-9-]+)\.dll$' dlls.txt; then exit 1; fi
              export WINEPREFIX=$RUNNER_TEMP/wine
              run=scripts/wine-run.sh ;;
          esac
          $run "$bin" --version
          printf 'class A {\ndef f() {\nprintln 1\n}\n}\n' > "$RUNNER_TEMP/A.groovy"
          if $run "$bin" --check "$RUNNER_TEMP/A.groovy"; then exit 1; fi
          $run "$bin" "$RUNNER_TEMP/A.groovy"
          $run "$bin" --check "$RUNNER_TEMP/A.groovy"
          cat "$RUNNER_TEMP/A.groovy"
      - name: Package
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then label=$GITHUB_REF_NAME; else label=dev; fi
          name=groovyfmt-$label-$TARGET
          mkdir "$name"
          case $TARGET in
            *windows*)
              cp "target/$TARGET/release/groovyfmt.exe" README.md LICENSE "$name"/
              zip -r "$name.zip" "$name"
              shasum -a 256 "$name.zip" > "$name.zip.sha256" ;;
            *)
              cp "target/$TARGET/release/groovyfmt" README.md LICENSE "$name"/
              tar -czf "$name.tar.gz" "$name"
              shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            groovyfmt-*.tar.gz*
            groovyfmt-*.zip*

  # The VS Code extension (editors/vscode/): lint, unit tests, an integration test in
  # VS Code against this commit's groovyfmt, and a .vsix to try out. That .vsix carries no
  # release checksums, so it never downloads groovyfmt; release.yml packages the release
  # .vsix from the archives its own run built, so this one isn't uploaded for a tag.
  vscode:
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Version matches Cargo.toml
        run: |
          set -euxo pipefail
          test "$(node -p 'require("./package.json").version')" = "$(sed -n 's/^version = "\(.*\)"$/\1/p' ../../Cargo.toml | head -n 1)"
      - name: Build groovyfmt for the integration test
        working-directory: .
        run: cargo build --release --locked
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:unit
      # No display on the runner: Electron's headless Ozone backend needs none. Two runs:
      # trusted (diagnostics, format, fix all) and Restricted Mode (nothing the workspace
      # plants as groovyfmt.path or in node_modules may run).
      - name: Integration tests in VS Code
        env:
          GROOVYFMT_BIN: ${{ github.workspace }}/target/release/groovyfmt
          VSCODE_TEST_ARGS: --ozone-platform=headless
        run: npm run test:integration
      - name: Package
        run: |
          set -euxo pipefail
          vsix=groovyfmt-$(node -p 'require("./package.json").version').vsix
          npm run package -- --out "$vsix"
          unzip -l "$vsix"
          # bundled: no node_modules in the package
          if unzip -l "$vsix" | grep -q node_modules; then exit 1; fi
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-extension
          path: editors/vscode/groovyfmt-*.vsix

  # The JetBrains plugin (editors/jetbrains/): unit tests, integration tests in IntelliJ IDEA
  # against this commit's groovyfmt (diagnostics and formatting, an untrusted project that
  # plants binaries, and LSP4IJ's user-defined server), the Plugin Verifier against the IDEs
  # the plugin claims, and a plugin zip to try out. That zip carries no release checksums, so
  # it never downloads groovyfmt. Skipped for a tag: release.yml's jetbrains job tests and
  # packages the release zip itself, after the release exists, so a failure in the plugin
  # never holds back a release. Nothing is cached: the IDEs are several GB, and the Rust
  # caches would be evicted for them.
  jetbrains:
    name: jetbrains plugin
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/jetbrains
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21.0.13
      - name: Build groovyfmt for the integration tests
        working-directory: .
        run: cargo build --release --locked
      # The IDE the plugin builds against and the four the verifier checks take about 15 GB
      # unpacked, more than the runner has free.
      - name: Disk space for the IDEs
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # Dependency verification is on: gradle/verification-metadata.xml checks every download,
      # the IDEs included.
      - name: Tests, the plugin zip and the Plugin Verifier
        env:
          GROOVYFMT_BIN: ${{ github.workspace }}/target/release/groovyfmt
        run: ./gradlew --no-daemon --no-scan check buildPlugin verifyPlugin
      - name: Version matches Cargo.toml, no checksums, no bundled Kotlin
        run: |
          set -euxo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' ../../Cargo.toml | head -n 1)
          zip=build/distributions/groovyfmt-jetbrains-$version.zip
          jar=groovyfmt-jetbrains/lib/groovyfmt-jetbrains-$version.jar
          unzip -l "$zip"
          unzip -p "$zip" "$jar" > plugin.jar
          unzip -p plugin.jar META-INF/plugin.xml | grep -F "<version>$version</version>"
          if unzip -l plugin.jar | grep -q groovyfmt-checksums.properties; then exit 1; fi
          if unzip -l "$zip" | grep -q kotlin-stdlib; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jetbrains-plugin
          path: editors/jetbrains/build/distributions/groovyfmt-jetbrains-*.zip

  # The install channels (action.yml, npm/, packaging/, Dockerfile), each run
  # against the latest published release so none of them can rot. Skipped when
  # release.yml calls this workflow for a tag: they test the previous release.
  action:
    name: action (${{ matrix.os }})
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # macOS only on a manual run (see the top of this file).
        exclude:
          - os: ${{ github.event_name == 'workflow_dispatch' && 'none' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: |
          mkdir ci-sample
          printf 'class A {\ndef f() {\nprintln 1\n}\n}\n' > ci-sample/A.groovy
      - id: setup
        uses: ./
        with:
          version: latest
          args: ""
      - name: groovyfmt is on PATH
        env:
          INSTALLED: ${{ steps.setup.outputs.version }}
        run: |
          set -euxo pipefail
          test "$(groovyfmt --version)" = "groovyfmt ${INSTALLED#v}"
      - id: unformatted
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.setup.outputs.version }}
          args: --check --output-format github ci-sample/A.groovy
      - name: the check failed on the unformatted sample
        if: steps.unformatted.outcome != 'failure'
        run: exit 1
      - run: groovyfmt ci-sample/A.groovy
      # latest is immutable, so the installs above ran gh release verify-asset. v0.13.1 is from
      # before immutable releases: no attestation, so only its .sha256 is checked.
      - id: mutable
        uses: ./
        with:
          version: v0.13.1
          args: ""
      - name: it installed the mutable release
        env:
          GOT: ${{ steps.mutable.outputs.version }}
        run: test "$GOT" = v0.13.1
      - uses: ./
        with:
          version: ${{ steps.setup.outputs.version }}
          args: --check --output-format github ci-sample/A.groovy
      # No version input: the release named by the action ref's Cargo.toml. First a ref at
      # the latest release, then one whose version has no release (a tag whose release run
      # failed, or main ahead of the last release), which must fail rather than install another.
      - name: the action ref's Cargo.toml names the latest release
        env:
          INSTALLED: ${{ steps.setup.outputs.version }}
        run: |
          sed -i.bak "s/^version = \".*\"$/version = \"${INSTALLED#v}\"/" Cargo.toml
          grep -x "version = \"${INSTALLED#v}\"" Cargo.toml
      - id: from-ref
        uses: ./
        with:
          args: ""
      - name: it installed that release
        env:
          INSTALLED: ${{ steps.setup.outputs.version }}
          GOT: ${{ steps.from-ref.outputs.version }}
        run: test "$GOT" = "$INSTALLED"
      - name: the action ref's Cargo.toml names a version with no release
        run: |
          sed -i.bak 's/^version = ".*"$/version = "0.0.0"/' Cargo.toml
          grep -x 'version = "0.0.0"' Cargo.toml
      - id: no-release
        continue-on-error: true
        uses: ./
        with:
          args: ""
      - name: the install failed
        if: steps.no-release.outcome != 'failure'
        run: exit 1

  npm:
    name: npm (${{ matrix.os }})
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # macOS only on a manual run (see the top of this file).
        exclude:
          - os: ${{ github.event_name == 'workflow_dispatch' && 'none' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build, pack and install the packages from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          archives=$RUNNER_TEMP/archives
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'groovyfmt-*' --dir "$archives"
          node npm/build.mjs "$tag" "$archives"
          for dir in npm/dist/*/; do npm pack "./$dir" --pack-destination "$RUNNER_TEMP"; done
          platform=$(node -p 'process.platform + "-" + process.arch')
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/prefix" \
            "$RUNNER_TEMP/groovyfmt-${tag#v}.tgz" "$RUNNER_TEMP/groovyfmt-$platform-${tag#v}.tgz"
          test "$("$RUNNER_TEMP/prefix/node_modules/.bin/groovyfmt" --version)" = "groovyfmt ${tag#v}"
          # A checksum mismatch must stop the build.
          printf '%064d  x\n' 0 > "$archives/groovyfmt-$tag-x86_64-apple-darwin.tar.gz.sha256"
          if node npm/build.mjs "$tag" "$archives"; then exit 1; fi

  homebrew:
    name: homebrew formula
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Render the formula for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir "$RUNNER_TEMP/sha"
          packaging/homebrew/render.sh "$tag" "$RUNNER_TEMP/sha" > "$RUNNER_TEMP/groovyfmt.rb"
          cat "$RUNNER_TEMP/groovyfmt.rb"
          ruby -c "$RUNNER_TEMP/groovyfmt.rb"
          if grep -q '@' "$RUNNER_TEMP/groovyfmt.rb"; then exit 1; fi

  docker:
    name: docker (${{ matrix.os }})
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the image from the latest release and run it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*-linux-musl.tar.gz*' --dir "$RUNNER_TEMP/archives"
          packaging/docker/context.sh "$RUNNER_TEMP/archives" "$RUNNER_TEMP/ctx"
          docker buildx create --use --driver docker-container
          # Both platforms, as release.yml pushes them, then the native one to run.
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile "$RUNNER_TEMP/ctx"
          docker buildx build --load -t groovyfmt:ci -f Dockerfile "$RUNNER_TEMP/ctx"
          test "$(docker run --rm groovyfmt:ci --version)" = "groovyfmt ${tag#v}"
          mkdir "$RUNNER_TEMP/sample"
          printf 'class A {\ndef f() {\nprintln 1\n}\n}\n' > "$RUNNER_TEMP/sample/A.groovy"
          if docker run --rm -v "$RUNNER_TEMP/sample:/work" groovyfmt:ci --check; then exit 1; fi
          docker run --rm -v "$RUNNER_TEMP/sample:/work" groovyfmt:ci
          docker run --rm -v "$RUNNER_TEMP/sample:/work" groovyfmt:ci --check A.groovy

  # The Gradle plugin (gradle-plugin/): unit tests and TestKit tests on the
  # wrapper's Gradle and on the oldest supported one, then the plugin applied to
  # a sample project, downloading the latest release.
  gradle-plugin:
    name: gradle plugin
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gradle-plugin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17.0.21
      - run: ./gradlew --no-daemon check
      - name: Apply the plugin to a sample project with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GROOVYFMT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          plugin=$PWD
          sample=$RUNNER_TEMP/sample
          mkdir -p "$sample/src"
          printf "pluginManagement {\n    includeBuild '%s'\n}\nrootProject.name = 'sample'\n" "$plugin" > "$sample/settings.gradle"
          printf "plugins {\n    id 'base'\n    id 'io.github.costajohnt.groovyfmt'\n}\ngroovyfmt {\n    version = '%s'\n}\n" "${tag#v}" > "$sample/build.gradle"
          printf 'class A {\ndef f() {\nprintln 1\n}\n}\n' > "$sample/src/A.groovy"
          cd "$sample"
          if "$plugin/gradlew" --no-daemon groovyfmtCheck; then exit 1; fi
          test -x "$HOME/.gradle/groovyfmt/${tag#v}/x86_64-unknown-linux-musl/groovyfmt"
          "$plugin/gradlew" --no-daemon groovyfmtFormat
          "$plugin/gradlew" --no-daemon check --configuration-cache
          "$plugin/gradlew" --no-daemon check --configuration-cache --offline
