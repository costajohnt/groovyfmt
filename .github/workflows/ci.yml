name: CI

# Not run on pushes or pull requests, to save Actions minutes: run
# scripts/ci-local.sh before merging instead. This workflow runs for a release
# and when started by hand (gh workflow run ci.yml --ref <branch>).
on:
  # release.yml calls this workflow, so a tag publishes only if every job here passes.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Format and lint our own fixtures
        run: |
          cargo build --release --locked
          printf 'class A {\ndef f() {\nprintln 1\n}\n}\n' > /tmp/A.groovy
          ./target/release/groovyfmt --check /tmp/A.groovy && exit 1 || true
          ./target/release/groovyfmt /tmp/A.groovy
          ./target/release/groovyfmt --check /tmp/A.groovy

  msrv:
    # Keep in step with rust-version in Cargo.toml.
    name: test (Rust 1.90.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo +1.90.0 test --locked

  # The release targets, built and run on every run of this workflow. On a tag,
  # release.yml publishes the archives this job uploads.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target "$TARGET"
      - name: Smoke test
        shell: bash
        run: |
          set -exo pipefail
          bin=target/$TARGET/release/groovyfmt
          file "$bin"
          run=
          case $TARGET in
            *linux*)
              # Rust's musl targets link static-pie, which file(1) reports as "static-pie linked".
              file "$bin" | grep -Eq 'statically linked|static-pie linked'
              readelf -d "$bin" > dyn.txt || true
              cat dyn.txt
              if grep -q NEEDED dyn.txt; then exit 1; fi
              # No glibc: the binary must start on Alpine.
              docker run --rm -v "$PWD/$bin:/groovyfmt:ro" alpine:3 /groovyfmt --version ;;
            x86_64-apple-darwin) run='arch -x86_64' ;;
          esac
          $run "$bin" --version
          printf 'class A {\ndef f() {\nprintln 1\n}\n}\n' > "$RUNNER_TEMP/A.groovy"
          if $run "$bin" --check "$RUNNER_TEMP/A.groovy"; then exit 1; fi
          $run "$bin" "$RUNNER_TEMP/A.groovy"
          $run "$bin" --check "$RUNNER_TEMP/A.groovy"
          cat "$RUNNER_TEMP/A.groovy"
      - name: Package
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then label=$GITHUB_REF_NAME; else label=dev; fi
          name=groovyfmt-$label-$TARGET
          mkdir "$name"
          cp "target/$TARGET/release/groovyfmt" README.md LICENSE "$name"/
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: groovyfmt-*.tar.gz*

  # The install channels (action.yml, npm/, packaging/, Dockerfile), each run
  # against the latest published release so none of them can rot. Skipped when
  # release.yml calls this workflow for a tag: they test the previous release.
  action:
    name: action (${{ matrix.os }})
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: |
          mkdir ci-sample
          printf 'class A {\ndef f() {\nprintln 1\n}\n}\n' > ci-sample/A.groovy
      - id: setup
        uses: ./
        with:
          version: latest
          args: ""
      - name: groovyfmt is on PATH
        env:
          INSTALLED: ${{ steps.setup.outputs.version }}
        run: |
          set -euxo pipefail
          test "$(groovyfmt --version)" = "groovyfmt ${INSTALLED#v}"
      - id: unformatted
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.setup.outputs.version }}
          args: --check --output-format github ci-sample/A.groovy
      - name: the check failed on the unformatted sample
        if: steps.unformatted.outcome != 'failure'
        run: exit 1
      - run: groovyfmt ci-sample/A.groovy
      - uses: ./
        with:
          version: ${{ steps.setup.outputs.version }}
          args: --check --output-format github ci-sample/A.groovy

  npm:
    name: npm (${{ matrix.os }})
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build, pack and install the packages from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          archives=$RUNNER_TEMP/archives
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'groovyfmt-*' --dir "$archives"
          node npm/build.mjs "$tag" "$archives"
          for dir in npm/dist/*/; do npm pack "./$dir" --pack-destination "$RUNNER_TEMP"; done
          platform=$(node -p 'process.platform + "-" + process.arch')
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/prefix" \
            "$RUNNER_TEMP/groovyfmt-${tag#v}.tgz" "$RUNNER_TEMP/groovyfmt-$platform-${tag#v}.tgz"
          test "$("$RUNNER_TEMP/prefix/node_modules/.bin/groovyfmt" --version)" = "groovyfmt ${tag#v}"
          # A checksum mismatch must stop the build.
          printf '%064d  x\n' 0 > "$archives/groovyfmt-$tag-x86_64-apple-darwin.tar.gz.sha256"
          if node npm/build.mjs "$tag" "$archives"; then exit 1; fi

  homebrew:
    name: homebrew formula
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Render the formula for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir "$RUNNER_TEMP/sha"
          packaging/homebrew/render.sh "$tag" "$RUNNER_TEMP/sha" > "$RUNNER_TEMP/groovyfmt.rb"
          cat "$RUNNER_TEMP/groovyfmt.rb"
          ruby -c "$RUNNER_TEMP/groovyfmt.rb"
          if grep -q '@' "$RUNNER_TEMP/groovyfmt.rb"; then exit 1; fi

  docker:
    name: docker (${{ matrix.os }})
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the image from the latest release and run it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*-linux-musl.tar.gz*' --dir "$RUNNER_TEMP/archives"
          packaging/docker/context.sh "$RUNNER_TEMP/archives" "$RUNNER_TEMP/ctx"
          docker buildx create --use --driver docker-container
          # Both platforms, as release.yml pushes them, then the native one to run.
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile "$RUNNER_TEMP/ctx"
          docker buildx build --load -t groovyfmt:ci -f Dockerfile "$RUNNER_TEMP/ctx"
          test "$(docker run --rm groovyfmt:ci --version)" = "groovyfmt ${tag#v}"
          mkdir "$RUNNER_TEMP/sample"
          printf 'class A {\ndef f() {\nprintln 1\n}\n}\n' > "$RUNNER_TEMP/sample/A.groovy"
          if docker run --rm -v "$RUNNER_TEMP/sample:/work" groovyfmt:ci --check; then exit 1; fi
          docker run --rm -v "$RUNNER_TEMP/sample:/work" groovyfmt:ci
          docker run --rm -v "$RUNNER_TEMP/sample:/work" groovyfmt:ci --check A.groovy
