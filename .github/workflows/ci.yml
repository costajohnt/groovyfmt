name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Format and lint our own fixtures
        run: |
          cargo build --release
          printf 'class A {\ndef f() {\nprintln 1\n}\n}\n' > /tmp/A.groovy
          ./target/release/groovyfmt --check /tmp/A.groovy && exit 1 || true
          ./target/release/groovyfmt /tmp/A.groovy
          ./target/release/groovyfmt --check /tmp/A.groovy
