[package]
name = "groovyfmt"
version = "0.14.0"
edition = "2024"
rust-version = "1.90"
description = "Fast formatter and linter for Groovy, Gradle build scripts, and Jenkinsfiles"
license = "MIT"
repository = "https://github.com/costajohnt/groovyfmt"
readme = "README.md"
keywords = ["groovy", "gradle", "jenkins", "formatter", "linter"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/grammar", "/build.rs", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
tree-sitter = "0.26"
toml = "1.2"
# The Groovy grammar is vendored in grammar/ and compiled by build.rs; grammar/README.md
# says where it comes from and how to update it.
tree-sitter-language = "0.1.7"

[build-dependencies]
cc = "1.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
