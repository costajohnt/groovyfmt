[package]
name = "groovyfmt"
version = "0.7.0"
edition = "2024"
rust-version = "1.90"
description = "Fast formatter and linter for Groovy, Gradle build scripts, and Jenkinsfiles"
license = "MIT"
repository = "https://github.com/costajohnt/groovyfmt"
readme = "README.md"
keywords = ["groovy", "gradle", "jenkins", "formatter", "linter"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tree-sitter = "0.26"
toml = "1.2"
# Fork branch groovyfmt-base = upstream main + dekobon PR #49 + our fixes
# (dekobon/tree-sitter-groovy#56, #57, #60, and the fix/subscript-same-line,
# fix/final-parameters, fix/trait-implements, fix/script-annotated-declaration,
# fix/command-args, fix/assert-comma-message, fix/annotated-untyped-field,
# fix/multi-assignment, fix/annotation-values, fix/array-creation,
# fix/lambda-expressions, fix/method-declaration-forms, fix/synchronized-statement,
# fix/attribute-access-forms, fix/method-reference-quoted-name,
# fix/explicit-type-arguments, fix/list-spread, fix/reserved-keywords,
# fix/gstring-comment-text, fix/spread-map-argument, fix/annotation-type-modifiers,
# fix/enum-implements, fix/enum-constant-bodies, fix/switch-case-label-lists,
# fix/array-type-values, fix/subscript-multiple-indexes,
# fix/annotation-generic-argument, fix/annotations-after-modifiers,
# fix/modifier-quoted-method-name, fix/gstring-interpolation-statements,
# fix/record-contextual-keyword, fix/value-command-calls,
# fix/closure-parameter-defaults, fix/line-break-statements, fix/cast-generic-type,
# fix/dotted-command-name-argument, fix/command-named-args-after-line-break,
# fix/contextual-keywords, fix/instanceof-pattern-variable,
# fix/command-argument-starts, fix/parenthesized-command,
# fix/generic-type-values, fix/slashy-leading-whitespace,
# fix/anonymous-class-body, fix/line-continuation, fix/gstring-escaped-dollar,
# fix/closure-parameter-forms, fix/final-catch-and-resources,
# fix/final-multi-assignment, fix/while-empty-body, fix/script-untyped-methods,
# fix/type-parameter-spacing, fix/spread-map-entry-spacing,
# fix/dynamic-member-name, fix/untyped-varargs, fix/unicode-identifiers,
# fix/leading-dot-decimals, fix/annotation-positions,
# fix/annotated-untyped-methods, fix/default-methods, fix/enum-constant-forms,
# fix/spaced-type-arguments, fix/try-resource-line-break branches).
# Back to the crates.io release once those land upstream.
dekobon-tree-sitter-groovy = { git = "https://github.com/costajohnt/tree-sitter-groovy", rev = "35421724a2d1d54bbc1d33a479ee4cbbfa971fdc" }

[profile.release]
lto = true
codegen-units = 1
strip = true
