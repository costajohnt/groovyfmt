[package]
name = "groovyfmt"
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
description = "Fast formatter and linter for Groovy, Gradle build scripts, and Jenkinsfiles"
license = "MIT"
repository = "https://github.com/costajohnt/groovyfmt"
readme = "README.md"
keywords = ["groovy", "gradle", "jenkins", "formatter", "linter"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tree-sitter = "0.26"
toml = "1.2"
# Fork branch groovyfmt-base = upstream main + dekobon PR #49 + our fixes
# (dekobon/tree-sitter-groovy#56, #57, #60, and the fix/subscript-same-line,
# fix/final-parameters, fix/trait-implements branches). Back to the crates.io release once
# those land upstream.
dekobon-tree-sitter-groovy = { git = "https://github.com/costajohnt/tree-sitter-groovy", rev = "25b1f4b79d113862ba4e9d698fe18d2e73a42017" }

[profile.release]
lto = true
codegen-units = 1
strip = true
