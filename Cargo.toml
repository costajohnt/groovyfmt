[package]
name = "groovyfmt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast formatter and linter for Groovy, Gradle build scripts, and Jenkinsfiles"
license = "MIT"
repository = "https://github.com/costajohnt/groovyfmt"
readme = "README.md"
keywords = ["groovy", "gradle", "jenkins", "formatter", "linter"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tree-sitter = "0.26"
toml = "1.2"
# Fork branch groovyfmt-base = upstream main + dekobon PR #49 + our fixes
# (dekobon/tree-sitter-groovy#56, #57). Back to the crates.io release once
# those land upstream.
dekobon-tree-sitter-groovy = { git = "https://github.com/costajohnt/tree-sitter-groovy", rev = "0a5b2efb382c0a951ff33b3d53b6807ffe024793" }

[profile.release]
lto = true
codegen-units = 1
strip = true
